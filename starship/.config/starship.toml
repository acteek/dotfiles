add_newline = true
command_timeout = 5000
palette = "everforest"

format = """
$directory\
$git_branch\
$git_status\
$aws\
$gcloud\
${custom.gcloud_token}\
$line_break\
$os\
$character"""

[character]
success_symbol = '[INSERT ❯](bold green)'
error_symbol = '[INSERT ❯](bold red)'
vimcmd_symbol = '[NORMAL ❯](bold yellow)'

# Match the main prompt layout, replacing its character module during selection.
# Activated by the zsh visual-mode hook; native visual detection is fish-only.
[profiles]
visual = """
$directory\
$git_branch\
$git_status\
$aws\
$gcloud\
${custom.gcloud_token}\
$line_break\
$os\
[VISUAL ❯](bold purple) """

[git_commit]
commit_hash_length = 8
style = "bold white"

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '

[git_branch]
style = "fg:green"
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "red"
format = "[$all_status$ahead_behind]($style) "
conflicted = ""
up_to_date = ""
untracked  = "?"

[os]
disabled = false
format = '[$symbol ]($style)'
style = 'fg:grey2'

[aws]
style = "yellow"
symbol = "☁️ "
format = '[$symbol$profile | $region \[$duration\]]($style)'

# Display the active project; the token countdown is shown separately below.
[gcloud]
style = "blue"
symbol = "󱇶 "
format = '( [${symbol}${project}]($style) )'

# Offline countdown for the cached access token, which gcloud can auto-refresh.
[custom.gcloud_token]
command = '''
dir=${CLOUDSDK_CONFIG:-$HOME/.config/gcloud}
name=${CLOUDSDK_ACTIVE_CONFIG_NAME:-$(cat "$dir/active_config" 2>/dev/null)}
config="$dir/configurations/config_${name:-default}"
property() {
  awk -F ' *= *' -v section="[$1]" -v key="$2" '
    { sub(/\r$/, "") }
    /^\[/ { active = ($0 == section) }
    active && $1 == key { print $2; exit }
  ' "$config" 2>/dev/null
}
account=${CLOUDSDK_CORE_ACCOUNT:-$(property core account)}
[ -n "$account" ] || exit 0
for key in impersonate_service_account credential_file_override access_token access_token_file; do
  case "$key" in
    impersonate_service_account) override=${CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT:-$(property auth "$key")} ;;
    credential_file_override) override=${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-$(property auth "$key")} ;;
    access_token) override=${CLOUDSDK_AUTH_ACCESS_TOKEN:-$(property auth "$key")} ;;
    access_token_file) override=${CLOUDSDK_AUTH_ACCESS_TOKEN_FILE:-$(property auth "$key")} ;;
  esac
  [ -z "$override" ] || { echo 'unknown'; exit 0; }
done
universe=${CLOUDSDK_CORE_UNIVERSE_DOMAIN:-$(property core universe_domain)}
case "$universe" in ''|googleapis.com) ;; *) account="$account#$universe" ;; esac
account=$(printf '%s' "$account" | sed "s/'/''/g")
seconds=$(sqlite3 -readonly "$dir/access_tokens.db" "SELECT unixepoch(token_expiry) - unixepoch('now') FROM access_tokens WHERE account_id = '$account';" 2>/dev/null)
if [ -z "$seconds" ]; then echo 'unknown'
elif [ "$seconds" -le 0 ]; then echo 'expired'
elif [ "$seconds" -lt 60 ]; then echo '<1m'
elif [ "$seconds" -lt 3600 ]; then echo "$((seconds / 60))m"
else echo "$((seconds / 3600))h$((seconds / 60 % 60))m"
fi
'''
when = 'command -v sqlite3 >/dev/null 2>&1'
shell = ["sh"]
style = "blue"
format = '([\[$output\]]($style) )'

[os.symbols]
Ubuntu = "󰕈"
Macos = "󰀵"
Linux = "󰌽"
Arch = "󰣇"
Debian = "󰣚"

[directory]
style = "fg:blue"
read_only_style = "fg:blue"
truncation_length = 5
format = "[ $path]($style)[$read_only]($read_only_style) "

[palettes.everforest]
bg_dim = "#232a2e"
bg0 = "#2d353b"
bg1 = "#343f44"
bg2 = "#3d484d"
bg3 = "#475258"
bg4 = "#4f585e"
bg5 = "#56635f"
bg_visual = "#543a48"
bg_red = "#514045"
bg_green = "#425047"
bg_blue = "#3a515d"
bg_yellow = "#4d4c43"
fg = "#d3c6aa"
red = "#e67e80"
orange = "#e69875"
